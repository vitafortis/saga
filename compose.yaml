# Saga — paste and file sharing between devices.
#
#   cp .env.example .env    # behind SSO, leave SAGA_PASSWORD empty; otherwise set it
#   docker compose up -d
#   open http://<this-host>:3040
#
services:
  saga:
    image: ghcr.io/vitafortis/saga:latest
    # Or build from this checkout instead of pulling:
    # build: .
    container_name: saga
    restart: unless-stopped
    ports:
      - "3040:3000"
    environment:
      # Behind SSO (forward auth on the whole site), leave SAGA_PASSWORD empty: there's no
      # sign-in and everyone who gets past the IdP can share. Without SSO, set it: it's needed
      # to share anything (opening a code never needs it).
      SAGA_PASSWORD: ${SAGA_PASSWORD:-}
      # Optional: an extra API key from the environment (keys made in Settings are easier).
      SAGA_API_TOKEN: ${SAGA_API_TOKEN:-}
      # Limits (MB).
      SAGA_MAX_FILE_MB: ${SAGA_MAX_FILE_MB:-1024}
      SAGA_MAX_PASTE_MB: ${SAGA_MAX_PASTE_MB:-10}
      # Behind a TLS reverse proxy (Traefik, Caddy, nginx, Pangolin…): share links use the
      # public address. ORIGIN pins it; without it, X-Forwarded-Proto/Host are used.
      # ORIGIN: https://data.armgrp.dev
      # Real client IPs for rate limits (unknown-code lookups, sign-in attempts):
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: "1"
      # Backups to a NAS: uncomment this, the /backups mount and one of the nas-backups
      # volumes below. Snapshots every SAGA_BACKUP_HOURS, keeping SAGA_BACKUP_KEEP, plus
      # "Save to NAS" on items and collections.
      # SAGA_BACKUP_DIR: /backups
      # SAGA_BACKUP_HOURS: "24"
      # SAGA_BACKUP_KEEP: "14"
      # Send to Google Drive: an rclone remote and folder, plus the ./rclone mount below.
      # Make the remote with `rclone config` on a machine with a browser (see readme.md).
      # SAGA_CLOUD_REMOTE: gdrive:Saga
      # SAGA_CLOUD_NAME: Google Drive
    volumes:
      # Database, uploaded files and the session key.
      - saga-data:/data
      # - nas-backups:/backups
      # rclone's config, writable so it can refresh the Google sign-in (owned by uid 1000).
      # - ./rclone:/config/rclone

volumes:
  saga-data:
  # NAS share for backups, mounted by Docker itself (no mount on the host).
  # The share must be writable by uid 1000 (the container's "node" user).
  # NFS:
  # nas-backups:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=nas.lan,rw,nfsvers=4
  #     device: ":/volume1/backups/saga"
  # SMB / CIFS:
  # nas-backups:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: addr=nas.lan,username=backup,password=${NAS_PASSWORD},uid=1000,gid=1000,file_mode=0600,dir_mode=0700,vers=3.0
  #     device: //nas.lan/backups/saga
